[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-helper-bot"
version = "0.1.0"
description = "Telegram bot forwarding user messages to a local LLM and returning the model's reply."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0,<4.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.9",
    # Драйвер SQLite для rag.db: несёт сборку с включённой загрузкой расширений
    # (stdlib sqlite3 многих сборок CPython её не умеет) — design D10.
    "sqlean.py>=3.45",
    "pypdf>=6.14.2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
dev-helper-bot = "dev_helper_bot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not docker'"
markers = [
    "docker: интеграционные тесты реальной Docker-песочницы (запуск: pytest -m docker; требует установленный и запущенный Docker)",
]
