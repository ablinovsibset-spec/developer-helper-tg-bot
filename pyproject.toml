[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-helper-bot"
version = "0.1.0"
description = "Telegram bot forwarding user messages to a local LLM and returning the model's reply."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0,<4.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.scripts]
dev-helper-bot = "dev_helper_bot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
